name: Android APK

concurrency:
  group: gesco-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org gn.alpha --project-name gesco .

      - name: Configure Android compile SDK 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
          grep -n "compileSdk" android/app/build.gradle*

      - name: Install dependencies
        run: flutter pub get

      - name: Set Android compile SDK for Flutter plugins
        shell: bash
        run: |
          while IFS= read -r file; do
            sed -i \
              -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' \
              -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' \
              "$file"
          done < <(find "$HOME/.pub-cache" -type f \\( -path '*/android/build.gradle' -o -path '*/android/build.gradle.kts' \\))
          echo "Android plugin compile SDK values:"
          grep -R -n -E 'compileSdk(Version)?[[:space:]]*=' "$HOME/.pub-cache/hosted/pub.dev" --include='build.gradle' --include='build.gradle.kts' | head -40 || true

      - name: Generate Drift database
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GESCO-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
